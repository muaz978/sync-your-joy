name: Release extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.14."
            exit 1
          fi
          echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source, tests, and builds
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build and package production extension
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
          SYNCYOURJOY_ROOM_SERVER_URL: wss://sync-your-joy-rooms.sync-your-joy.workers.dev/rooms
        run: npm run release:package

      - name: Verify release checksum
        working-directory: release
        run: sha256sum --check sync-your-joy-extension.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_notes=$'### Install\n\n1. Download `sync-your-joy-extension.zip`.\n2. Extract the ZIP. Chrome cannot load it while it is still compressed.\n3. Open `chrome://extensions`, enable Developer mode, select Load unpacked, and choose the extracted `sync-your-joy-extension` folder.\n4. Refresh any streaming tabs that were already open.\n\nEvery participant watches through their own authorized account. SyncYourJoy synchronizes playback state only and never captures or retransmits video or audio.'
          gh release create "$GITHUB_REF_NAME" \
            'release/sync-your-joy-extension.zip#SyncYourJoy Chrome extension' \
            'release/sync-your-joy-extension.zip.sha256#SHA-256 checksum' \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SyncYourJoy $GITHUB_REF_NAME" \
            --latest \
            --generate-notes \
            --notes "$release_notes"
