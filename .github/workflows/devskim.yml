name: DevSkim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays at 03:37 UTC — off-peak, offset from CodeQL's own weekly run
    # (03:17) so they don't contend for the same runner minute.
    - cron: '37 3 * * 1'

concurrency:
  group: devskim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16
        with:
          # Pinned explicitly: the upload step below reads this exact file, and
          # a changed action default would otherwise break it without failing
          # a required check.
          output-filename: devskim-results.sarif

      - name: Upload DevSkim results to the Security tab
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: devskim-results.sarif
