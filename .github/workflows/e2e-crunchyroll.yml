name: Authenticated Crunchyroll E2E

on:
  workflow_dispatch:
    inputs:
      provider_url:
        description: HTTPS Crunchyroll /watch URL for the authorized acceptance run
        required: true
        type: string

permissions:
  contents: read

jobs:
  crunchyroll-two-profile:
    name: Crunchyroll two-profile playback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYNCYOURJOY_CRUNCHYROLL_URL: ${{ inputs.provider_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # No secrets are in scope yet. This proves the helper still applies a
      # storage state and refuses one that did not arrive (issue #30).
      - name: Check storage-state application with dummy states
        run: npx playwright test --config tests/e2e/playwright.config.ts tests/e2e/extension-profile-storage-state.spec.ts

      - name: Materialize protected browser state files
        env:
          STORAGE_STATE_A_B64: ${{ secrets.SYNCYOURJOY_CRUNCHYROLL_STORAGE_STATE_A_B64 }}
          STORAGE_STATE_B_B64: ${{ secrets.SYNCYOURJOY_CRUNCHYROLL_STORAGE_STATE_B_B64 }}
          REQUIRED_COOKIE_NAMES: ${{ secrets.SYNCYOURJOY_CRUNCHYROLL_REQUIRED_COOKIE_NAMES }}
        run: |
          set -euo pipefail
          test -n "$STORAGE_STATE_A_B64" || { echo 'Missing SYNCYOURJOY_CRUNCHYROLL_STORAGE_STATE_A_B64.' >&2; exit 1; }
          test -n "$STORAGE_STATE_B_B64" || { echo 'Missing SYNCYOURJOY_CRUNCHYROLL_STORAGE_STATE_B_B64.' >&2; exit 1; }
          test -n "$REQUIRED_COOKIE_NAMES" || { echo 'Missing SYNCYOURJOY_CRUNCHYROLL_REQUIRED_COOKIE_NAMES.' >&2; exit 1; }
          printf '%s' "$STORAGE_STATE_A_B64" | base64 --decode > "$RUNNER_TEMP/syncyourjoy-crunchyroll-a.json"
          printf '%s' "$STORAGE_STATE_B_B64" | base64 --decode > "$RUNNER_TEMP/syncyourjoy-crunchyroll-b.json"
          # An uncaught JSON.parse error prints the offending line of the file,
          # which would put cookie values in this public log. Print a fixed
          # message instead.
          node -e "const fs = require('node:fs'); for (const path of process.argv.slice(1)) { let state; try { state = JSON.parse(fs.readFileSync(path, 'utf8')) } catch { state = undefined } if (!state || !Array.isArray(state.cookies)) { console.error('A protected storage-state secret is not a Playwright storage-state JSON file.'); process.exit(1) } }" \
            "$RUNNER_TEMP/syncyourjoy-crunchyroll-a.json" \
            "$RUNNER_TEMP/syncyourjoy-crunchyroll-b.json"

      - name: Run authenticated Crunchyroll E2E
        env:
          SYNCYOURJOY_CRUNCHYROLL_STORAGE_STATE_A: ${{ runner.temp }}/syncyourjoy-crunchyroll-a.json
          SYNCYOURJOY_CRUNCHYROLL_STORAGE_STATE_B: ${{ runner.temp }}/syncyourjoy-crunchyroll-b.json
          SYNCYOURJOY_CRUNCHYROLL_REQUIRED_COOKIE_NAMES: ${{ secrets.SYNCYOURJOY_CRUNCHYROLL_REQUIRED_COOKIE_NAMES }}
        run: npm run test:e2e:crunchyroll

      - name: Remove protected browser state files
        if: always()
        run: rm -f "$RUNNER_TEMP/syncyourjoy-crunchyroll-a.json" "$RUNNER_TEMP/syncyourjoy-crunchyroll-b.json"
