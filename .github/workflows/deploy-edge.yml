name: Deploy room coordinator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Durable Object coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source before deployment
        run: npm run typecheck && npm test

      - name: Deploy Worker
        run: npx wrangler deploy --config apps/edge-service/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
