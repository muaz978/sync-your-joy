name: Deploy room coordinator

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Durable Object coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source before deployment
        run: npm run typecheck && npm test

      - name: Deploy Worker
        run: npx wrangler deploy --config apps/edge-service/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
