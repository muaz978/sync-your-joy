<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncYourJoy adaptive fixture</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111827; color: #f8fafc; }
    body { max-width: 980px; margin: 0 auto; padding: 2rem; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
    button { border: 1px solid #475569; border-radius: .5rem; background: #1e293b; color: inherit; padding: .65rem .8rem; cursor: pointer; }
    button:hover { border-color: #67e8f9; }
    video { display: block; width: min(100%, 720px); min-height: 120px; background: #000; }
    iframe { width: 100%; min-height: 230px; border: 1px solid #475569; }
    pre { padding: 1rem; border-radius: .5rem; background: #0f172a; overflow: auto; white-space: pre-wrap; }
    .badge { display: inline-block; padding: .2rem .5rem; border-radius: 999px; background: #164e63; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>SyncYourJoy controlled adaptive fixture</h1>
  <p>This page owns an unencrypted fragmented MP4, exercises native MediaSource append behavior, and records deterministic fault timing. It is not a provider or DRM emulator.</p>
  <p id="surface"><span class="badge">top-document</span></p>
  <div class="controls">
    <button id="load-adaptive" type="button">Load adaptive MSE media</button>
    <button id="create-shadow" type="button">Create open Shadow DOM player</button>
    <button id="replace-player" type="button">Replace active player node</button>
    <button id="replace-source" type="button">Replace source on the active player</button>
    <button id="release-hold" type="button">Release held loader</button>
    <button id="spa-transition" type="button">Change SPA episode</button>
    <button id="open-nested" type="button">Open cross-origin nested frame</button>
    <button id="rate-reset" type="button">Reset playback rate</button>
  </div>
  <section id="player-host" aria-label="Adaptive player host"></section>
  <section id="nested-host" hidden></section>
  <pre id="fixture-state">phase: idle</pre>
  <pre id="fixture-events">events: []</pre>
  <script>
    const params = new URLSearchParams(location.search)
    const manifestUrl = new URL('/adaptive-manifest.json', location.href)
    const stateElement = document.querySelector('#fixture-state')
    const eventsElement = document.querySelector('#fixture-events')
    const playerHost = document.querySelector('#player-host')
    const nestedHost = document.querySelector('#nested-host')
    const events = []
    const state = {
      phase: 'idle',
      surface: params.get('surface') || 'top-document',
      route: location.pathname + location.search,
      duration: 0,
      bufferedRanges: [],
      loadedSegments: [],
      missingSegments: [],
      mediaSourceType: '',
      activePlayerNode: null,
      nodeSerial: 0,
      loadCount: 0,
      holding: false,
      playbackRate: 1,
    }
    let activeVideo = null
    let activeSourceBuffer = null
    let activeMediaSource = null
    let manifest = null
    let nodeSerialCounter = 0
    // Every load takes a generation. A load that finds a newer one has started
    // stops appending, so replacing the source of the same element cannot leave
    // an older loader writing into the new MediaSource.
    let loadGeneration = 0
    let releaseHold = null
    // A held loader always lets go on its own, so a test that fails before it
    // releases cannot leave a page stuck for the rest of the run.
    const HOLD_LIMIT_MS = 30000

    function record(type, details = {}) {
      const event = { at: new Date().toISOString(), elapsedMs: Math.round(performance.now()), type, ...details }
      events.push(event)
      eventsElement.textContent = `events: ${JSON.stringify(events, null, 2)}`
      updateState()
    }

    function updateState() {
      if (activeVideo) {
        state.duration = Number.isFinite(activeVideo.duration) ? activeVideo.duration : 0
        state.playbackRate = activeVideo.playbackRate
        if (activeVideo.buffered) {
          state.bufferedRanges = Array.from({ length: activeVideo.buffered.length }, (_, index) => [
            Number(activeVideo.buffered.start(index).toFixed(3)),
            Number(activeVideo.buffered.end(index).toFixed(3)),
          ])
        }
      }
      state.route = location.pathname + location.search
      state.activePlayerNode = activeVideo?.id || null
      stateElement.textContent = JSON.stringify({ ...state, eventCount: events.length }, null, 2)
    }

    function attachMediaEvents(video, label) {
      for (const type of ['loadstart', 'emptied', 'loadedmetadata', 'durationchange', 'canplay', 'playing', 'pause', 'waiting', 'stalled', 'seeking', 'seeked', 'ended', 'error', 'ratechange']) {
        video.addEventListener(type, () => record(`native-${type}`, {
          label,
          nodeSerial: Number(video.dataset.fixtureNodeSerial),
          readyState: video.readyState,
          paused: video.paused,
          currentTime: Number(video.currentTime.toFixed(3)),
          playbackRate: video.playbackRate,
        }))
      }
    }

    function mountPlayer(container, label) {
      const video = document.createElement('video')
      video.id = label
      video.controls = true
      video.preload = 'metadata'
      video.setAttribute('data-fixture-player', label)
      nodeSerialCounter += 1
      video.dataset.fixtureNodeSerial = String(nodeSerialCounter)
      state.nodeSerial = nodeSerialCounter
      container.replaceChildren(video)
      activeVideo = video
      attachMediaEvents(video, label)
      record('player-mounted', { label, nodeSerial: nodeSerialCounter })
      return video
    }

    function findOrMountTopPlayer() {
      return activeVideo || mountPlayer(playerHost, 'adaptive-player')
    }

    function resetLoadState() {
      state.loadedSegments = []
      state.missingSegments = []
      state.bufferedRanges = []
      state.duration = 0
      state.mediaSourceType = ''
    }

    let holdCount = 0
    function holdLoader(index) {
      holdCount += 1
      // holdLimitMs shortens only the first hold, so a test can let one hold run
      // out on its own while later holds keep the full limit.
      const requestedLimit = Number(params.get('holdLimitMs')) || HOLD_LIMIT_MS
      const limitMs = holdCount === 1 ? Math.min(HOLD_LIMIT_MS, Math.max(200, requestedLimit)) : HOLD_LIMIT_MS
      return new Promise((resolve) => {
        let released = false
        const timer = setTimeout(() => release('timeout'), limitMs)
        function release(reason) {
          // A hold lets go once, and only the hold that owns the slot clears it:
          // an older hold's callback must not clear a newer hold's handle or its
          // holding flag.
          if (released)
            return
          released = true
          clearTimeout(timer)
          if (releaseHold === release) {
            releaseHold = null
            state.holding = false
          }
          record('hold-released', { index, reason })
          resolve()
        }
        releaseHold = release
        state.holding = true
        record('hold-start', { index, limitMs })
      })
    }

    async function loadAdaptiveMedia(reason = 'manual') {
      const generation = ++loadGeneration
      const superseded = () => generation !== loadGeneration
      // A superseded load records where it stopped and does nothing else: it must
      // not write to shared state, the element or the active MediaSource.
      const stop = at => record('load-superseded', { generation, at })
      const video = findOrMountTopPlayer()
      // Every load starts from nothing, whether it follows a source replacement,
      // a node replacement or the first load.
      resetLoadState()
      state.phase = 'loading'
      state.loadCount += 1
      record('load-start', { reason, node: video.id, nodeSerial: Number(video.dataset.fixtureNodeSerial), generation })
      try {
        // Only the first load can be told to wait for its manifest (manifestDelayMs),
        // which is how a test replaces the source while an older load is still in
        // flight. The server ignores a value that is not on its allowlist.
        const manifestDelayMs = state.loadCount === 1 ? Math.min(2000, Math.max(0, Number(params.get('manifestDelayMs')) || 0)) : 0
        const manifestRequest = new URL(manifestUrl)
        if (manifestDelayMs > 0)
          manifestRequest.searchParams.set('delayMs', String(manifestDelayMs))
        const response = await fetch(manifestRequest)
        if (!response.ok)
          throw new Error(`Manifest request failed with ${response.status}.`)
        const loadedManifest = await response.json()
        // A newer load may have started and finished while this one waited. It owns
        // the element now: this one must not touch the active MediaSource or the
        // element's source, or it leaves the element attached to a source nothing
        // will ever append to.
        if (superseded())
          return stop('manifest')
        manifest = loadedManifest
        const mediaSource = new MediaSource()
        activeMediaSource = mediaSource
        video.src = URL.createObjectURL(mediaSource)
        await once(mediaSource, 'sourceopen')
        if (superseded())
          return stop('sourceopen')
        const candidates = [
          'video/mp4; codecs="avc1.42c00a"',
          'video/mp4; codecs="avc1.4d401e"',
          'video/mp4',
        ]
        const mime = candidates.find(candidate => MediaSource.isTypeSupported(candidate))
        if (!mime)
          throw new Error('This browser does not support the owned fixture MP4 codec.')
        state.mediaSourceType = mime
        const sourceBuffer = mediaSource.addSourceBuffer(mime)
        activeSourceBuffer = sourceBuffer
        const initialization = await fetchBuffer('/adaptive/init.mp4')
        if (superseded())
          return stop('initialization-response')
        await appendBuffer(sourceBuffer, initialization, 'initialization')
        if (superseded())
          return stop('initialization-append')
        record('initialization-appended', { mime })

        // A fault that is not named in the URL is not injected: -1 means "no
        // segment", because Number(null) is 0 and would silently pick segment 0.
        const indexParam = name => params.has(name) ? Number(params.get(name)) : -1
        const delaySegment = indexParam('delaySegment')
        const delayMs = Math.min(2000, Math.max(0, Number(params.get('delayMs')) || 0))
        const missingSegment = indexParam('missingSegment')
        const holdAfter = indexParam('holdAfter')
        const disjoint = params.get('disjoint') === '1'
        // The owned clip has a keyframe every 20 s, which is every fifth segment
        // (0, 5, 10, ...). The offset has to be applied where a segment starts on
        // a keyframe: after a gap the browser discards every frame until the next
        // keyframe, so an offset at segment 6 left a 20 s hole, not a 4 s one.
        const disjointAt = params.has('disjointAt') ? Number(params.get('disjointAt')) : 5
        const rateReset = params.get('rateReset') === '1'
        for (let index = 0; index < manifest.segmentCount; index++) {
          if (superseded())
            return stop(`segment-${index}`)
          const delayed = index === delaySegment && delayMs > 0
          const missing = index === missingSegment
          const query = new URLSearchParams()
          if (delayed) query.set('delayMs', String(delayMs))
          if (missing) query.set('missing', '1')
          const separator = query.size ? `?${query}` : ''
          const requestedDelayMs = delayed ? delayMs : 0
          record('segment-request', { index, delayed, delayMs: requestedDelayMs, requestedDelayMs, missing })
          const requestedAt = performance.now()
          const segmentResponse = await fetch(`/adaptive/segment/${index}.mp4${separator}`)
          if (superseded())
            return stop(`segment-${index}-response`)
          const fetchMs = Math.round(performance.now() - requestedAt)
          // What the server applied, from its own response header, not from what
          // this page asked for: a value that is not on the server's allowlist
          // is requested but not applied.
          const appliedDelayMs = Number(segmentResponse.headers.get('x-syncyourjoy-fixture-delay-ms') ?? 0)
          record('segment-response', { index, status: segmentResponse.status, requestedDelayMs, appliedDelayMs, fetchMs })
          if (!segmentResponse.ok) {
            state.missingSegments.push(index)
            record('segment-missing', { index, status: segmentResponse.status, delayMs: appliedDelayMs })
            continue
          }
          if (disjoint && index === disjointAt) {
            sourceBuffer.timestampOffset = manifest.segmentDurationSeconds
            record('disjoint-offset-applied', { index, timestampOffset: sourceBuffer.timestampOffset })
          }
          const segmentBytes = await segmentResponse.arrayBuffer()
          if (superseded())
            return stop(`segment-${index}-body`)
          await appendBuffer(sourceBuffer, segmentBytes, `segment-${index}`)
          if (superseded())
            return stop(`segment-${index}-append`)
          state.loadedSegments.push(index)
          record('segment-appended', { index, delayMs: appliedDelayMs })
          if (rateReset && index === 4) {
            video.playbackRate = 1.5
            record('playback-rate-changed', { index, playbackRate: video.playbackRate })
            await wait(120)
            if (superseded())
              return stop(`segment-${index}-rate-reset`)
            video.playbackRate = 1
            record('playback-rate-reset', { index, playbackRate: video.playbackRate })
          }
          if (index === holdAfter) {
            await holdLoader(index)
            if (superseded())
              return stop(`segment-${index}-hold`)
          }
        }
        if (superseded())
          return stop('end-of-stream')
        if (mediaSource.readyState === 'open' && !sourceBuffer.updating)
          mediaSource.endOfStream()
        state.phase = 'ready'
        record('load-complete', { loadedSegments: state.loadedSegments.length, missingSegments: state.missingSegments, generation })
        updateState()
      }
      catch (error) {
        // Replacing the source detaches this load's SourceBuffer, so an append or
        // a read on it can throw. That is the replacement working, not a fault of
        // the load that replaced it.
        if (superseded())
          return stop('error')
        throw error
      }
    }

    // Changes the source of the element that is already on the page. The node is
    // not replaced: it keeps its identity and its listeners, and the browser
    // reports `emptied` and then `loadstart` for it, which a player that swaps
    // streams in place produces and a node replacement does not.
    async function replaceSourceOnActivePlayer(reason = 'manual') {
      const video = activeVideo
      if (!video)
        throw new Error('There is no active player whose source could be replaced.')
      loadGeneration += 1
      if (releaseHold)
        releaseHold('source-replaced')
      const previousSource = video.currentSrc || video.getAttribute('src') || ''
      if (previousSource.startsWith('blob:'))
        URL.revokeObjectURL(previousSource)
      resetLoadState()
      video.removeAttribute('src')
      video.load()
      record('source-replaced', { reason, node: video.id, nodeSerial: Number(video.dataset.fixtureNodeSerial), sameElement: true })
      await loadAdaptiveMedia('source-replacement')
    }

    async function fetchBuffer(path) {
      const response = await fetch(path)
      if (!response.ok)
        throw new Error(`Fixture request failed with ${response.status}: ${path}`)
      return response.arrayBuffer()
    }

    function appendBuffer(sourceBuffer, data, label) {
      return new Promise((resolve, reject) => {
        const onUpdate = () => {
          cleanup()
          resolve()
        }
        const onError = () => {
          cleanup()
          reject(new Error(`SourceBuffer append failed for ${label}.`))
        }
        const cleanup = () => {
          sourceBuffer.removeEventListener('updateend', onUpdate)
          sourceBuffer.removeEventListener('error', onError)
        }
        sourceBuffer.addEventListener('updateend', onUpdate, { once: true })
        sourceBuffer.addEventListener('error', onError, { once: true })
        sourceBuffer.appendBuffer(data)
      })
    }

    function once(target, eventName) {
      return new Promise(resolve => target.addEventListener(eventName, resolve, { once: true }))
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms))
    }

    document.querySelector('#load-adaptive').addEventListener('click', () => {
      void loadAdaptiveMedia().catch(error => {
        state.phase = 'error'
        record('fixture-error', { message: String(error?.message || error) })
      })
    })

    document.querySelector('#create-shadow').addEventListener('click', () => {
      if (document.querySelector('fixture-shadow-player')) return
      const host = document.createElement('fixture-shadow-player')
      const root = host.attachShadow({ mode: 'open' })
      const container = document.createElement('div')
      container.dataset.shadowPlayerHost = 'true'
      root.append(container)
      playerHost.append(host)
      const video = mountPlayer(container, 'shadow-player')
      record('open-shadow-created', { node: video.id })
    })

    document.querySelector('#replace-player').addEventListener('click', () => {
      const previous = activeVideo?.id || null
      const video = mountPlayer(playerHost, 'replacement-player')
      record('node-replaced', { previous, next: video.id, nodeSerial: Number(video.dataset.fixtureNodeSerial) })
    })

    document.querySelector('#replace-source').addEventListener('click', () => {
      void replaceSourceOnActivePlayer().catch(error => {
        state.phase = 'error'
        record('fixture-error', { message: String(error?.message || error) })
      })
    })

    document.querySelector('#release-hold').addEventListener('click', () => {
      if (releaseHold)
        releaseHold('button')
    })

    document.querySelector('#spa-transition').addEventListener('click', () => {
      const next = `${location.pathname}?episode=2&surface=${encodeURIComponent(state.surface)}`
      history.pushState({ episode: 2 }, '', next)
      record('spa-episode-transition', { route: next })
    })

    document.querySelector('#open-nested').addEventListener('click', () => {
      const nestedUrl = new URL(location.href)
      nestedUrl.hostname = location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1'
      nestedUrl.searchParams.set('surface', 'cross-origin-nested-frame')
      nestedUrl.searchParams.set('autostart', '1')
      const iframe = document.createElement('iframe')
      iframe.title = 'Cross-origin adaptive fixture frame'
      iframe.src = nestedUrl.toString()
      nestedHost.hidden = false
      nestedHost.replaceChildren(iframe)
      record('cross-origin-frame-created', { origin: nestedUrl.origin })
    })

    document.querySelector('#rate-reset').addEventListener('click', () => {
      if (!activeVideo) return
      activeVideo.playbackRate = 1.75
      record('playback-rate-changed', { playbackRate: activeVideo.playbackRate, source: 'manual' })
      void wait(120).then(() => {
        if (!activeVideo) return
        activeVideo.playbackRate = 1
        record('playback-rate-reset', { playbackRate: activeVideo.playbackRate, source: 'manual' })
      })
    })

    window.__SYNCYOURJOY_ADAPTIVE_FIXTURE__ = {
      events,
      state,
      load: loadAdaptiveMedia,
      replaceSource: replaceSourceOnActivePlayer,
      release: () => releaseHold ? (releaseHold('api'), true) : false,
      snapshot: () => ({ ...state, events: [...events] }),
    }
    const surfaceBadge = document.createElement('span')
    surfaceBadge.className = 'badge'
    surfaceBadge.textContent = state.surface
    document.querySelector('#surface')?.replaceChildren(surfaceBadge)
    mountPlayer(playerHost, 'adaptive-player')
    updateState()
    const autostart = params.get('autostart') === '1' || location.pathname === '/adaptive-autostart.html'
    if (autostart)
      void loadAdaptiveMedia('autostart').catch(error => record('fixture-error', { message: String(error?.message || error) }))
  </script>
</body>
</html>
